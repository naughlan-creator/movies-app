# Dependabot opens pull requests when dependencies have updates, including security fixes.
# The CI workflow then tells you whether each update is safe to merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /movies-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /movies-frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom"]
    # React 19 is a planned upgrade (react + react-dom together), not a weekly bump.
    # Delete this block when we do that upgrade.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-services:
        patterns: ["*"]                     # one PR for all compose images

  # Base images in the Dockerfiles (JDK/JRE, Node, Caddy)
  - package-ecosystem: docker
    directories:
      - /movies-backend
      - /movies-frontend
    schedule:
      interval: weekly
