# Dependabot opens pull requests when dependencies have updates, including security fixes.
# The CI workflow then tells you whether each update is safe to merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /movies-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /movies-frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom"]
    # React 19 is a planned upgrade (react + react-dom together), not a weekly bump.
    # Delete this block when we do that upgrade.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-services:
        patterns: ["*"]                     # one PR for all compose images
    ignore:
      # TEI's tags start with the GPU architecture (120- = RTX 50 series), which Dependabot misreads
      # as a version number. Upgrade it by hand, keeping the 120- prefix.
      - dependency-name: "*text-embeddings-inference"

  # Base images in the Dockerfiles (JDK/JRE, Node, Caddy)
  - package-ecosystem: docker
    directories:
      - /movies-backend
      - /movies-frontend
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node releases never become LTS; move between even (LTS) versions deliberately
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x"]
