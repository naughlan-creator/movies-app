# Tests must never touch Atlas or TMDB, whatever is in .env

# Replaced by Testcontainers via @ServiceConnection. These values only stop
# Spring from trying to resolve the Atlas ${MONGO_*} placeholders, which don't exist in CI.
spring.mongodb.uri=mongodb://localhost/unused
spring.mongodb.database=movies_test

# No telemetry export from tests (no collector is running)
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false

# Never read secrets from Vault in tests, even if .env sets VAULT_ENABLED=true
spring.cloud.vault.enabled=false

# An empty token makes TrendingMoviesSync skip the TMDB call
app.tmdb.api-token=

# Integration tests share one context and many requests; RateLimitFilterTest covers the limits themselves
app.rate-limit.reads-per-minute=100000
app.rate-limit.writes-per-minute=100000

# Tests never call Keycloak: they use spring-security-test's jwt() post-processor,
# which skips decoding. These values only need to be well-formed.
app.security.oidc.issuer-uri=http://keycloak.test/realms/movie-gold
app.security.oidc.jwk-set-uri=http://keycloak.test/realms/movie-gold/protocol/openid-connect/certs

# Tests must never make paid calls, even though .env (with the real key) is loaded when they run
app.ai.api-key=

app.ai.digest.refresh-enabled=false