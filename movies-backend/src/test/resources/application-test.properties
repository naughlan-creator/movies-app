# Tests must never touch Atlas or TMDB, whatever is in .env

# Replaced by Testcontainers via @ServiceConnection. These values only stop
# Spring from trying to resolve the Atlas ${env.*} placeholders, which don't exist in CI.
spring.mongodb.uri=mongodb://localhost/unused
spring.mongodb.database=movies_test

# An empty token makes TrendingMoviesSync skip the TMDB call
app.tmdb.api-token=