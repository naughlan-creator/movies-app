spring.application.name=movies
spring.mongodb.database=${env.MONGO_DATABASE}
# MONGO_URI wins when set (e.g. the local replica set from docker compose); otherwise build the Atlas URI
spring.mongodb.uri=${env.MONGO_URI:mongodb+srv://${env.MONGO_USER}:${env.MONGO_PASSWORD}@${env.MONGO_CLUSTER}/movies}
server.port=${env.SERVER_PORT:8080}
# Behind a TLS-terminating proxy (Caddy), trust X-Forwarded-* headers, but only from internal
# addresses (Tomcat's RemoteIpValve default), so the app sees the real client IP and "https".
# A client on the internet sending its own X-Forwarded-For is ignored.
server.forward-headers-strategy=native
app.cors.allowed-origins=${env.CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.image-base-url=https://image.tmdb.org/t/p
app.tmdb.api-token=${env.TMDB_API_TOKEN:}
app.tmdb.trending-limit=10

springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=${env.API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${env.API_DOCS_ENABLED:true}

spring.threads.virtual.enabled=true

# Keycloak issues the tokens; the API only verifies them with Keycloak's public keys.
# issuer-uri must equal the token's "iss" exactly. jwk-set-uri can differ (e.g. an internal hostname).
app.security.oidc.issuer-uri=${env.OIDC_ISSUER_URI:http://localhost:18180/realms/movie-gold}
app.security.oidc.jwk-set-uri=${env.OIDC_JWK_SET_URI:http://localhost:18180/realms/movie-gold/protocol/openid-connect/certs}
app.security.oidc.audience=movie-gold-api
# 0 on localhost; 31536000 (one year) in production
app.security.hsts-max-age-seconds=${env.HSTS_MAX_AGE_SECONDS:0}

# Per client (user, or IP when anonymous). Writes are scarcer: they cost storage and, later, LLM calls.
app.rate-limit.enabled=true
app.rate-limit.reads-per-minute=120
app.rate-limit.writes-per-minute=10
app.rate-limit.max-tracked-clients=100000

# Swagger UI logs in as the same public client as the React app, with PKCE
springdoc.swagger-ui.oauth.client-id=movies-frontend
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true