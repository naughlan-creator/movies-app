spring.application.name=movies

# ---- Where configuration comes from (later sources override earlier ones) ----
# 1. this file
# 2. ./.env, read as a properties file (local secrets, never committed)
# 3. Vault, when VAULT_ENABLED=true (keys at secret/movies are Spring property names)
# OS environment variables override all of the above, which is how containers and CI inject settings.
# Imports are processed in order, so the Vault settings below can already see values from .env.
spring.config.import=optional:file:.env[.properties],optional:vault://

# ---- Vault (opt-in) ----
spring.cloud.vault.enabled=${VAULT_ENABLED:false}
spring.cloud.vault.uri=${VAULT_URI:http://localhost:18200}
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=movies
# If Vault is enabled but unreachable, refuse to start rather than run without secrets
spring.cloud.vault.fail-fast=true

# ---- MongoDB ----
spring.mongodb.database=${MONGO_DATABASE:movies}
# MONGO_URI wins when set (e.g. the local replica set from docker compose); otherwise build the Atlas URI
spring.mongodb.uri=${MONGO_URI:mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_CLUSTER}/movies}

# ---- Web ----
server.port=${SERVER_PORT:8080}
# Behind a TLS-terminating proxy (Caddy), trust X-Forwarded-* headers, but only from internal
# addresses (Tomcat's RemoteIpValve default), so the app sees the real client IP and "https".
# A client on the internet sending its own X-Forwarded-For is ignored.
server.forward-headers-strategy=native
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.threads.virtual.enabled=true

# ---- TMDB ----
app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.image-base-url=https://image.tmdb.org/t/p
app.tmdb.api-token=${TMDB_API_TOKEN:}
app.tmdb.trending-limit=10

# ---- API docs ----
springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
# Swagger UI logs in as the same public client as the React app, with PKCE
springdoc.swagger-ui.oauth.client-id=movies-frontend
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# ---- Security ----
# Keycloak issues the tokens; the API only verifies them with Keycloak's public keys.
# issuer-uri must equal the token's "iss" exactly. jwk-set-uri can differ (e.g. an internal hostname).
app.security.oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:18180/realms/movie-gold}
app.security.oidc.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:18180/realms/movie-gold/protocol/openid-connect/certs}
app.security.oidc.audience=movie-gold-api
# 0 on localhost; 31536000 (one year) in production
app.security.hsts-max-age-seconds=${HSTS_MAX_AGE_SECONDS:0}

# Per client (user, or IP when anonymous). Writes are scarcer: they cost storage and, later, LLM calls.
app.rate-limit.enabled=true
app.rate-limit.reads-per-minute=120
app.rate-limit.writes-per-minute=10
app.rate-limit.max-tracked-clients=100000
