# Local infrastructure for the movie app.
# Start everything:  docker compose up -d
# Values like ${KEYCLOAK_ADMIN_PASSWORD} come from ./.env (copy .env.example).
#
# Host ports avoid the ranges Windows reserves for Hyper-V/WSL (e.g. 8000-8554, 6274-6473),
# which is why they look unusual. See README.md for the full port map.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # start-dev: plain HTTP and an embedded database. Development only; production uses `start`,
    # which requires TLS and an external database.
    # --import-realm: on first start, create realms from ./keycloak/import
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Pin the public URL so the token issuer ("iss") is always the same,
      # however Keycloak is reached; other containers may use the internal hostname.
      KC_HOSTNAME: http://localhost:18180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "18180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro

  mongo:
    image: mongo:9.0
    # A single-node replica set: MongoDB only supports multi-document transactions on replica sets
    # (used by the transactional outbox). Atlas clusters are always replica sets.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then just reports its status
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    # A single node that is both broker and controller (KRaft mode: no ZooKeeper since Kafka 4)
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners, because clients connect to whatever address the broker advertises:
      #  - PLAINTEXT (9092): for apps on the host, e.g. the backend run with mvnw -> localhost:9092
      #  - DOCKER (29092): for containers on the compose network, e.g. the "backend" service -> kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so internal topics can only have one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:8.8.3-alpine
    # A pure cache: no persistence, a memory cap, and least-recently-used eviction when full
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # 6379 is inside a range Windows reserves, hence 16379
      - "16379:6379"

  observability:
    # Grafana's all-in-one OpenTelemetry backend for development: an OTLP collector plus
    # Prometheus (metrics), Tempo (traces), Loki (logs) and Grafana to explore them.
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "13000:3000"   # Grafana UI (user admin / admin)
      # 4317/4318 are inside a range Windows reserves, hence 14317/14318
      - "14317:4317"   # OTLP over gRPC
      - "14318:4318"   # OTLP over HTTP (what the backend uses)

  vault:
    image: hashicorp/vault:2.1.1
    # Dev mode: in-memory storage, already unsealed, a KV v2 engine at secret/. Everything is lost on
    # restart (re-run vault/seed-dev-secrets.ps1). Production runs `vault server` with real storage,
    # TLS, and unseal keys or auto-unseal.
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      # 8200 is inside a range Windows reserves, hence 18200
      - "18200:8200"

  caddy:
    image: caddy:2.11.4-alpine
    # Opt-in: docker compose --profile tls up -d caddy
    profiles: ["tls"]
    ports:
      - "19443:443"
    environment:
      # Where the API runs; the backend runs on the host, outside Docker
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:18080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the local CA and certificates across restarts, so the root you trusted stays valid
      - caddy-data:/data

  # ---- The apps themselves, as containers (opt-in: docker compose --profile app up -d --build) ----
  # For day-to-day coding, run them on the host instead (mvnw spring-boot:run, npm start).

  backend:
    profiles: ["app"]
    build: ./movies-backend
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      # Inside the compose network, services are reached by name, not localhost
      MONGO_URI: mongodb://mongo:27017/movies?directConnection=true
      MONGO_DATABASE: movies
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The issuer must match the tokens' "iss", which is the URL the BROWSER uses for Keycloak.
      # The keys can be fetched over the internal network.
      OIDC_ISSUER_URI: http://localhost:18180/realms/movie-gold
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/movie-gold/protocol/openid-connect/certs
      OTLP_ENDPOINT: http://observability:4318
      CORS_ALLOWED_ORIGINS: http://localhost:13080,http://localhost:3000
      # Optional: add TMDB_API_TOKEN to the root .env to sync trending movies in this mode
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    ports:
      - "18085:8080"

  frontend:
    profiles: ["app"]
    build:
      context: ./movies-frontend
      args:
        # Baked into the JavaScript at build time: the URLs the browser will call
        REACT_APP_API_BASE_URL: http://localhost:18085
        REACT_APP_OIDC_AUTHORITY: http://localhost:18180/realms/movie-gold
        REACT_APP_OIDC_CLIENT_ID: movies-frontend
    depends_on:
      - backend
    ports:
      - "13080:80"

volumes:
  keycloak-data:
  mongo-data:
  caddy-data:
