# A one-node local cluster. Run: Kind create cluster --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: movie-gold
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # backend service (NodePort)
        hostPort: 18095
      - containerPort: 30081 # frontend service (also NodePort)
        hostPort: 18096